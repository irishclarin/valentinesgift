<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="topbar">
    <div class="brand">Gift For You</div>
    <button id="togglePetals" class="pill" type="button" aria-pressed="true">Petals: On</button>
  </header>

  <main class="wrap">
    <section class="card glass">
      <div class="badge">Valentine’s Gift</div>

      <!-- EDIT THIS NAME -->
      <h1 class="title">
        A bouquet for <span class="name" id="toName">You</span>
      </h1>

      <p class="subtitle">
        Press “Give Bouquet” — Bubu will hand you flowers. 
      </p>

      <div class="actions">
        <button id="giveBtn" class="btn primary" type="button">Give Bouquet</button>
        <button id="styleBtn" class="btn" type="button">Change Bouquet Style</button>
        <button id="noteBtn" class="btn" type="button">Open Note</button>
        <button id="downloadBtn" class="btn" type="button">Download Card</button>
      </div>

      <div class="scene" aria-label="Bubu giving bouquet scene">
        <div class="bubu" id="bubu" title="Tap me to give the bouquet!">
          <div class="ear ear--l"></div>
          <div class="ear ear--r"></div>
          <div class="head">
            <div class="face">
              <div class="eye eye--l"></div>
              <div class="eye eye--r"></div>
              <div class="blush blush--l"></div>
              <div class="blush blush--r"></div>
              <div class="snout">
                <div class="nose"></div>
                <div class="smile"></div>
              </div>
            </div>
          </div>
          <div class="body">
            <div class="arm arm--l"></div>
            <div class="arm arm--r"></div>
            <div class="belly"></div>
          </div>
          <div class="shadow"></div>
        </div>

        <div class="bouquetWrap">
          <div class="tag" id="tag">Tap “Give Bouquet”</div>
          <div class="bouquet" id="bouquet"></div>
        </div>
      </div>

      <div class="footer">
        <div class="tiny">Bouquet-only gift • change style • petals mode • downloadable card</div>
      </div>
    </section>
  </main>

 
  <div class="modal" id="modal" aria-hidden="true" role="dialog">
    <div class="modal__overlay" id="modalOverlay"></div>
    <div class="modal__panel glass">
      <div class="modal__top">
        <div class="modal__title">A Little Note 💌</div>
        <button class="iconBtn" id="closeModal" type="button" aria-label="Close">✕</button>
      </div>

     
      <p class="note" id="noteText">
        Happy Valentine’s Day. Here’s a bouquet because you deserve gentle things.
      </p>

      <div class="actions modalActions">
        <button id="copyNote" class="btn primary" type="button">Copy Note</button>
        <button id="sparkleBtn" class="btn" type="button">Sprinkle Sparkles</button>
      </div>
    </div>
  </div>

  <div class="fxLayer" id="fxLayer" aria-hidden="true"></div>
  <canvas id="cardCanvas" width="1080" height="1350" class="hidden"></canvas>

  <script src="script.js"></script>
</body>
</html>
